# Whole engine, flat (py65 harness) build — the bottom 22K ($0000-$57FF,
# below the banked framebuffer) is IDENTICAL to the banked build (one
# code area, same data pages). $1A00-$25FF is the ONE documented
# exception window (slid from $1E00-$29FF 2026-08-19): banked = walk
# driver $1A00 + PMOVE/PMH $1E40; flat = VXC_YLO $1A00 / VXC_YHI $1C00,
# CPM_KDY $1E00, CPM keys $1F00, tighten records $2000/$2100, PM_SCRATCH
# $2200, PMH $2300. (Second, smaller divergence: flat VCACHE $0800 and
# VXC_XLO/XHI $1200-$15FF sit where the banked map is free.)
# Flat-only content lives ABOVE the line: CLIPF $5800, VPLOTF $A500,
# then the flat squatter map — scan symmap MERGED before claiming space.
MEMORY {
    CODE:   start = $2500, size = $3300, file = "engine_code.bin";
    # (head $2A00 -> $2600 2026-08-19 window slide; PMB1-4 append after
    #  CODE in this declaration order — IDENTICAL addresses to the banked
    #  build, which is the point: bank B carries no code any more.
    #  $2600 -> $2500 2026-08-23 in lockstep with the banked cfg: banked
    #  reclaimed the PMOVE region's dead last page, and bottom-22K
    #  identity means flat follows. Shrinks the exception window to
    #  $1A00-$24FF; PMBF/PMH at $2300-$23FF is its last tenant.)
    CLIPF:  start = $5800, size = $1880, file = "engine_clipf.bin";
    # (grown $1800 -> $1A00 2026-08-25 for the fused cluster + exact
    #  backface, then CUT to $1880 2026-08-26: the LV1 K planes live at
    #  $7080/$7100 (loader-poked data, invisible to ld65 — the region
    #  MUST stop below them so code growth is a link error, not a
    #  silent overwrite). Wall chain: K planes, then RCACHE_STATE $7268.)
    # (2026-08-25: the FUSED walker (clip/fused.s) + the records
    #  machinery's deletion net out SMALLER than the records design —
    #  the interim $1A68 growth was reverted the same day. Earlier
    #  growth: $1600 -> $1800 2026-08-21, the six tfs value helpers
    #  inlined; VPLOTF vacated $6E00.)
    VPLOTF: start = $A500, size = $0500, file = "engine_vplotf.bin";
    # (moved $6E00 -> $A500 2026-08-21. $A500 was picked by PROBING the
    #  live flat harness, per the squatter-map warning above: $A400-$B0FF
    #  is zero at load and untouched across renders (3327 B free), while
    #  the obvious-looking $7000 is the ROTATION CACHE (RCACHE_STATE
    #  $7268 / RC_PH_1 $7300 / RC_P1L_0 $7400) and $7500-$7D18 is the
    #  harness's NJ raster blob. Flat-only: banked vplot is VPLOTC.)
    PMOVE:  start = $AA00, size = $06F0, file = "engine_pmove.bin";
    # REHOMED $7F10 -> $AA00 (2026-08-23).  The old start overlapped the
    # LIVE flat VWHC planes ($8200-$85FF) and RC_P2L_0 ($8100), so any
    # render corrupted flat pm code past $8100.  That landmine was
    # documented on 2026-08-19 and noted as never having fired because no
    # gate interleaved flat renders with flat pm execution -- and then the
    # Tube port started calling pm_frame between renders, which is exactly
    # that interleave.  It fired: project.s's VWHC writes rewrote
    # pm_frame's entry JSR operand ($83BE: 20 48 50 -> 20 48 fb) and the
    # copro vanished into the MOS on its SECOND frame.
    # $AA00 is the tail of the same $A400-$B0FF hole VPLOTF was probed
    # into on 2026-08-21 (zero at load, untouched across renders); VPLOTF
    # holds $A500-$A9FF, leaving $AA00-$B0FF = 1792 B for PMOVE's 1776.
    # It also ships: the copro's DATA load covers $8600-$E9FF.
    # Do NOT put anything new in $7F10-$85FF -- it is VWHC/RC_P2L_0.
    PMBF:   start = $2300, size = $0100, file = "engine_pmbf.bin";
    # (shrunk $0600 -> $0100 2026-08-19: only PMH is left here — the four
    #  PMB slices moved to the shared CODE tail)
}
SEGMENTS {
    CODE:   load = CODE,  type = ro, align = $100;
    PMB1:   load = CODE,  type = ro;
    PMB2:   load = CODE,  type = ro;
    PMB3:   load = CODE,  type = ro;
    PMB4:   load = CODE,  type = ro;
    CLIPF:  load = CLIPF, type = ro, align = $100;
    VPLOTF: load = VPLOTF, type = ro, align = $100;
    PMOVE:  load = PMOVE, type = ro;
    PMH:    load = PMBF,  type = ro;
}
