# Whole engine, flat (py65 harness) build — LOW-RAM map 2026-08-26:
# $0000-$0EFF is IDENTICAL to the banked build (zp/stack/sqr, PLOTQ
# $0600, bitmap $0700, pool $0800-$09FF, WORK $0A00-$0B7F, scratch
# $0B80, COLPORT $0D00). The banked driver/PMOVE span $0F00-$19FF is
# flat's cache zone instead: VCACHE $0F00-$16FF, CPM_KDY $1700, CPM
# keys $1800, FW $1900. CODE $1A00-$57FF is shared again; the CODE
# tail's free run also hosts flat VXC_X $4D00, VXC_Y $5100, RC_P2L_1
# $5500, PM_SCRATCH $5600, PMH $5700 — the old $1A00-$24FF exception
# window is DEAD.
# Flat-only content lives ABOVE the line: CLIPF $5800, VPLOTF $A500,
# then the flat squatter map — scan symmap MERGED before claiming space.
MEMORY {
    # THE data segment (2026-08-30): writable scratch, so storage stops
    # being baked as literal equates.  $0C20-$0CFF is free in BOTH builds
    # (mapshuf), above the old hand-laid arena and below COLPORT at the
    # LOW_BASE $0D00 load base.  Identical in both maps by the bottom-22K
    # rule, which is what lets one declaration serve both.
    WORK:   start = $0C20, size = $00E0, type = rw, file = "";
    # GREW $3300 -> $3800 (2026-08-30): DBOUND ($4D00), the PMZ region
    # ($4D80) and the VXC X pair ($4E00-$51FF) moved out, so CODE runs
    # $1A00-$51FF and ends at VXC_YLO $5200.
    CODE:   start = $1A00, size = $3800, file = "engine_code.bin";
    # (size $3300 -> $3400 2026-08-29: pm_ycells in PMB4; the cap is the
    #  VXC_XLO boundary at $4E00 — growth past THAT must stay a link error)
    # (size $3300, NOT $3E00: the region MUST stop at $4CFF — the flat
    #  flat DBOUND plane $4D00 + cache homes $4E00-$57FF are runtime
    #  state, invisible to ld65;
    #  CODE growth past them must be a link error, never a stomp.)
    # ($2500 -> $1A00 2026-08-26: the LOW-RAM CONSOLIDATION, in lockstep
    #  with the banked cfg. The exception window DIED: flat tenants moved
    #  to $0F00-$19FF (VCACHE $0F00, CPM_KDY $1700, CPM keys $1800, FW
    #  $1900) and the tail run (VXC_X $4E00, VXC_Y $5200, RC_P2L_1 $5600,
    #  PM_SCRATCH $5700, PMH $57A0).)
    # (head $2A00 -> $2600 2026-08-19 window slide; PMB1-4 append after
    #  CODE in this declaration order — IDENTICAL addresses to the banked
    #  build, which is the point: bank B carries no code any more.
    #  $2600 -> $2500 2026-08-23 in lockstep with the banked cfg: banked
    #  reclaimed the PMOVE region's dead last page, and bottom-22K
    #  identity means flat follows. Shrinks the exception window to
    #  $1A00-$24FF; PMBF/PMH at $2300-$23FF is its last tenant.)
    CLIPF:  start = $5800, size = $1980, file = "engine_clipf.bin";
    # (grown $1880 -> $1A00 2026-08-27 for the armed/solid pair entries:
    #  the BKT/DBOUND planes vacated $7080-$71FF; the wall above is now
    #  RCACHE_STATE $7268.)
    # (grown $1800 -> $1A00 2026-08-25 for the fused cluster + exact
    #  backface, then CUT to $1880 2026-08-26: the LV1 K planes live at
    #  $7080/$7100 (loader-poked data, invisible to ld65 — the region
    #  MUST stop below them so code growth is a link error, not a
    #  silent overwrite). Wall chain: K planes, then RCACHE_STATE $7268.)
    # (2026-08-25: the FUSED walker (clip/fused.s) + the records
    #  machinery's deletion net out SMALLER than the records design —
    #  the interim $1A68 growth was reverted the same day. Earlier
    #  growth: $1600 -> $1800 2026-08-21, the six tfs value helpers
    #  inlined; VPLOTF vacated $6E00.)
    # SHRUNK $0500 -> $0100 (2026-08-30): the flat vplot body is gone
    # (plot_v is a 3-byte patch slot now) and this region holds only
    # PMCND/PQ.  It must STOP at $A600, where the VXC X pair now
    # lives -- a region that outruns its neighbour is the same
    # "declared size is a lie" trap that let the HUD grow into VDESC.
    VPLOTF: start = $A500, size = $0100, file = "engine_vplotf.bin";
    # (moved $6E00 -> $A500 2026-08-21. $A500 was picked by PROBING the
    #  live flat harness, per the squatter-map warning above: $A400-$B0FF
    #  is zero at load and untouched across renders (3327 B free), while
    #  the obvious-looking $7000 is the ROTATION CACHE (RCACHE_STATE
    #  $7268 / RC_PH_1 $7300 / RC_P1L_0 $7400) and $7500-$7D18 is the
    #  harness's NJ raster blob. Flat-only: banked vplot is VPLOTC.)
    PMOVE:  start = $AA00, size = $0700, file = "engine_pmove.bin";
    # REHOMED $7F10 -> $AA00 (2026-08-23).  The old start overlapped the
    # LIVE flat VWHC planes ($8200-$85FF) and RC_P2L_0 ($8100), so any
    # render corrupted flat pm code past $8100.  That landmine was
    # documented on 2026-08-19 and noted as never having fired because no
    # gate interleaved flat renders with flat pm execution -- and then the
    # Tube port started calling pm_frame between renders, which is exactly
    # that interleave.  It fired: project.s's VWHC writes rewrote
    # pm_frame's entry JSR operand ($83BE: 20 48 50 -> 20 48 fb) and the
    # copro vanished into the MOS on its SECOND frame.
    # $AA00 is the tail of the same $A400-$B0FF hole VPLOTF was probed
    # into on 2026-08-21 (zero at load, untouched across renders); VPLOTF
    # holds $A500-$A9FF, leaving $AA00-$B0FF = 1792 B for PMOVE's 1776.
    # It also ships: the copro's DATA load covers $8600-$E9FF.
    # Do NOT put anything new in $7F10-$85FF -- it is VWHC/RC_P2L_0.
    PMBF:   start = $57A0, size = $0060, file = "engine_pmbf.bin";
}
SEGMENTS {
    WORK:   load = WORK,  type = bss;
    CODE:   load = CODE,  type = ro, align = $100;
    PMB1:   load = CODE,  type = ro;
    PMB2:   load = CODE,  type = ro;
    PMB3:   load = CODE,  type = ro, optional = yes;
    PMB4:   load = CODE,  type = ro;
    CLIPF:  load = CLIPF, type = ro, align = $100;
    VPLOTF: load = VPLOTF, type = ro, align = $100;
    PMCND:   load = CODE,  type = ro, optional = yes;
    PQ:   load = CODE,  type = ro, optional = yes;
    PMZ:   load = CODE,  type = ro, optional = yes;
    PMSF:   load = CODE,  type = ro, optional = yes;
    OBJX:   load = CODE,  type = ro, optional = yes;
    OBJB:   load = CODE,  type = ro, optional = yes;
    OBJG:   load = CODE,  type = ro, optional = yes;
    PMMU:   load = CODE,  type = ro, optional = yes;
    PMWK:   load = CODE,  type = ro, optional = yes;
    PMOVE:  load = PMOVE, type = ro;
    PMH:    load = PMBF,  type = ro;
    PMEXT:   load = CODE,  type = ro, optional = yes;
}
