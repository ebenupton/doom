# Whole engine, flat (py65 harness) build — the bottom 22K ($0000-$57FF,
# below the banked framebuffer) is IDENTICAL to the banked build (one
# code area, same data pages). $1A00-$25FF is the ONE documented
# exception window (slid from $1E00-$29FF 2026-08-19): banked = walk
# driver $1A00 + PMOVE/PMH $1E40; flat = VXC_YLO $1A00 / VXC_YHI $1C00,
# CPM_KDY $1E00, CPM keys $1F00, tighten records $2000/$2100, PM_SCRATCH
# $2200, PMH $2300. (Second, smaller divergence: flat VCACHE $0800 and
# VXC_XLO/XHI $1200-$15FF sit where the banked map is free.)
# Flat-only content lives ABOVE the line: CLIPF $5800, VPLOTF $A500,
# then the flat squatter map — scan symmap MERGED before claiming space.
MEMORY {
    CODE:   start = $2600, size = $3200, file = "engine_code.bin";
    # (head $2A00 -> $2600 2026-08-19 window slide; PMB1-4 append after
    #  CODE in this declaration order — IDENTICAL addresses to the banked
    #  build, which is the point: bank B carries no code any more)
    CLIPF:  start = $5800, size = $1800, file = "engine_clipf.bin";
    # (grown $1600 -> $1800 2026-08-21: the six tfs value helpers were
    #  inlined into the sweep, which moves their bytes from the CODE
    #  region into the clipper's. VPLOTF vacated $6E00 to make room.)
    VPLOTF: start = $A500, size = $0500, file = "engine_vplotf.bin";
    # (moved $6E00 -> $A500 2026-08-21. $A500 was picked by PROBING the
    #  live flat harness, per the squatter-map warning above: $A400-$B0FF
    #  is zero at load and untouched across renders (3327 B free), while
    #  the obvious-looking $7000 is the ROTATION CACHE (RCACHE_STATE
    #  $7268 / RC_PH_1 $7300 / RC_P1L_0 $7400) and $7500-$7D18 is the
    #  harness's NJ raster blob. Flat-only: banked vplot is VPLOTC.)
    PMOVE:  start = $7F10, size = $06F0, file = "engine_pmove.bin";
    # LANDMINE (pre-existing, documented 2026-08-19): this region overlaps
    # the LIVE flat VWHC planes ($8200-$85FF) and RC_P2L_0 ($8100) — flat
    # pm code past $8100 is corrupted by any render. No gate interleaves
    # flat renders with flat pm execution, which is why it has never
    # fired. Fix = rehome flat PMOVE when space appears; do NOT put
    # anything new in $7F10-$85FF.
    PMBF:   start = $2300, size = $0100, file = "engine_pmbf.bin";
    # (shrunk $0600 -> $0100 2026-08-19: only PMH is left here — the four
    #  PMB slices moved to the shared CODE tail)
}
SEGMENTS {
    CODE:   load = CODE,  type = ro, align = $100;
    PMB1:   load = CODE,  type = ro;
    PMB2:   load = CODE,  type = ro;
    PMB3:   load = CODE,  type = ro;
    PMB4:   load = CODE,  type = ro;
    CLIPF:  load = CLIPF, type = ro, align = $100;
    VPLOTF: load = VPLOTF, type = ro, align = $100;
    PMOVE:  load = PMOVE, type = ro;
    PMH:    load = PMBF,  type = ro;
}
