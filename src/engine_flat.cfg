# Whole engine, flat (py65 harness) build — 2026-08-09 STANDARDISED map:
# the bottom 22K ($0000-$57FF, below the banked framebuffer) is
# IDENTICAL to the banked build (one code area $2A00-$57FF, same data
# pages; $1E00-$29FF is the ONE documented exception: banked = walk
# driver ($1F00) + the PMOVE/PMH region, flat = free page $1F00, the
# tighten record pages $2000/$2100, PM_SCRATCH $2200, PMBF $2300-$28FF
# and the CPM key planes $2900-$2AFF). The window was $2000-$2BFF until
# 2026-08-17, when the driver slid down onto the page ANIM_SSMASK left
# and CODE claimed $2B00 — flat matched by moving the CPM psi planes. Flat-only content lives ABOVE the line:
# CLIPF $5800 (the bank-C-equivalent clipper), VPLOTF $6E00, then the
# flat cache/level squatter map (RC_PH_1/RCACHE $7300/$7400, VXC $7500,
# CPM $7D00, psi $8000/$8100, VWHC $8200, level $8600.., FB $EA00 — scan symmap MERGED
# before claiming space).
MEMORY {
    CODE:   start = $2A00, size = $2E00, file = "engine_code.bin";
    CLIPF:  start = $5800, size = $1600, file = "engine_clipf.bin";
    VPLOTF: start = $6E00, size = $0500, file = "engine_vplotf.bin";
    PMOVE:  start = $7F10, size = $06F0, file = "engine_pmove.bin";
    # pm_frame: flat home = the free zone behind the flat records pages
    # ($2000-$21FF) + PM_SCRATCH ($2200-$22D3); CPM starts $2900. All
    # four banked bank-B windows fold into this ONE region.
    PMBF:   start = $2300, size = $0600, file = "engine_pmbf.bin";
}
SEGMENTS {
    CODE:   load = CODE,  type = ro, align = $100;
    CLIPF:  load = CLIPF, type = ro, align = $100;
    VPLOTF: load = VPLOTF, type = ro, align = $100;
    PMOVE:  load = PMOVE, type = ro;
    PMH:    load = PMBF,  type = ro;
    PMB1:   load = PMBF,  type = ro;
    PMB2:   load = PMBF,  type = ro;
    PMB3:   load = PMBF,  type = ro;
    PMB4:   load = PMBF,  type = ro;
}
