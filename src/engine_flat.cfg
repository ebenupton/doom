# Whole engine, flat (tube parasite / py65 harness) build — THE PARASITE
# MAP (Eben, 2026-09-01):
#   $0000-$57FF  IDENTICAL region layout to the banked build (driver
#                $0F00, PMOVE $1340, CODE to $57FF) — one LOW image.
#   $5800-$97FF  bank A image (L0, "seg group") laid flat.
#   $9600-$D5FF  bank B image (L2, "walk group") laid flat -- 512 B
#                down 2026-09-02: it rides bank A's freed top ($BE00+
#                window = flat $9600-$97FF ships nothing).
#   $D600-$EFFF  CBITS: bank C laid LINEARLY (flat = banked - $8000 +
#                $D600, 2026-09-02 purge) -- the clipper, then the
#                python-seeded data at the SAME offsets (VEXPL_CONT
#                $EE00, FW $EE80, sincos $EF00).  Not clearers or
#                rasterisers — the clipper links HERE (segment BANKC).
#   $F000-$F5FF  the linear run continues (python-seeded, invisible
#                to ld65):
#                OBJ_ART $F000-$F2E3 (3 aligned windows), VEXPL_LO/HI
#                $F300/$F380, VEXPL_CONT $F400, USEVEC $F480, FW state
#                $F580, RASTER_ENTRY/emit stubs $F5C0.  VDESC + the
#                driver SINCOS ride the bank A window hole ($A400+ =
#                flat $7C00/$7E00).  $F800+ = tube client OS.
# The bank images arrive VERBATIM from the banked builders; every
# bank-resident home is BANKx_ORG + offset (gen_abi/layout formulas).
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    WORK:   start = $0E20, size = $00E0, type = rw, file = "";
    # ONE PROGRAM (2026-09-05).  DRV $0F00-$133F and CODE $1340-$57FF
    # were adjacent regions writing two files, and the split was purely
    # historical -- the driver has been in this link since 2026-08-30.
    # One region, one file: the driver is simply the first thing in it,
    # so its entry stays $0F00 and PMOVE keeps its $1340 pin (declared
    # on the segment below) -- every address in the map is unchanged,
    # the bottom-22K identity rule included.  What goes away is the second
    # output file and the idea that the driver is a separate program.
    MAIN:   start = $0F00, size = $4900, file = "engine_fl.bin";
    # CBITS stops at $F000: the data run above is loader/python-seeded
    # and invisible to ld65 — clipper growth past it must be a link
    # error, never a silent stomp (the declared-size-is-a-lie lesson).
    CBITS:  start = $D600, size = $1A00, file = "engine_cbits.bin";
    # VPTAB (35 B of object-kind dispatch): banked lives in the VPLOTC
    # tail ($B9C2), whose linear image exceeds 64K -- the SECOND
    # documented exception (with VEXPL): the reclaimed client-OS page
    # $F900, staged at $7D00 on disc and boot-copied up with VEXPL.
    VPTABF: start = $F900, size = $0100, file = "engine_vptab_fl.bin";
}
SEGMENTS {
    DRV:    load = MAIN, type = ro, optional = yes;   # FIRST in MAIN: entry $0F00
    ZEROPAGE: load = ZP, type = zp;
    WORK:   load = WORK,  type = bss;
    BANKC:  load = CBITS, type = ro;
    BANKCHOST: load = CBITS, type = ro, optional = yes;  # EMPTY on the parasite
    RASTER: load = CBITS, type = ro, optional = yes;   # empty: the flat
                                        # image has no rasteriser
    VPLOTC: load = CBITS, type = ro, optional = yes;   # empty: vplot is banked-only
    VPTAB:  load = VPTABF, type = ro;                  # object dispatch tables
    # PMOVE is PINNED at $1340 (abi PMOVE_BASE): the driver is the
    # first thing in MAIN, but its length differs between the two
    # builds, so everything after it would drift and break the
    # bottom-22K identity rule.  The pin holds the boundary where
    # the two adjacent regions used to put it; the DRV tail slack
    # ($0F00+drvlen .. $133F) is the old DRV region padding.
    PMOVE:  load = MAIN,  type = ro, start = $1340;
    PMH:    load = MAIN,  type = ro;
    CODE:   load = MAIN,  type = ro, align = $100;
    RWC:    load = MAIN,  type = ro, optional = yes;
    RWCARD: load = MAIN,  type = ro, optional = yes;
    SHTAB:  load = MAIN,  type = ro, start = $5600, optional = yes;
    PMB1:   load = MAIN,  type = ro, optional = yes;
    PMB2:   load = MAIN,  type = ro, optional = yes;
    PMB3:   load = MAIN,  type = ro, optional = yes;
    PMB4:   load = MAIN,  type = ro, optional = yes;
    PMEXT:  load = MAIN,  type = ro, optional = yes;
    PMSF:   load = MAIN,  type = ro, optional = yes;
    OBJX:   load = MAIN,  type = ro, optional = yes;
    OBJB:   load = MAIN,  type = ro, optional = yes;
    OBJG:   load = MAIN,  type = ro, optional = yes;
    PQ:     load = MAIN,  type = ro, optional = yes;
    PMMU:   load = MAIN,  type = ro, optional = yes;
    PMWK:   load = MAIN,  type = ro, optional = yes;
    PMCND:  load = MAIN,  type = ro, optional = yes;
    PMZ:    load = MAIN,  type = ro, optional = yes;
    PMCOL:  load = MAIN,  type = ro, optional = yes;
    HUD:    load = MAIN,  type = ro, optional = yes;   # host draws the HUD;
                                                       # flat ships none
}
