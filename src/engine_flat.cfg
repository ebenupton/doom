# Whole engine, flat (tube parasite / py65 harness) build — THE PARASITE
# MAP (Eben, 2026-09-01):
#   $0000-$57FF  IDENTICAL region layout to the banked build (driver
#                $0F00, PMOVE $1340, CODE to $57FF) — one LOW image.
#   $5800-$97FF  bank A image (L0, "seg group") laid flat.
#   $9800-$D7FF  bank B image (L2, "walk group") laid flat.
#   $D800-$EFFF  CBITS: the bank C bits that are not clearers or
#                rasterisers — the clipper links HERE (segment BANKC).
#   $F200-$F7FF  CBITS data run (python-seeded, invisible to ld65):
#                OBJ_ART $F200-$F4E3 (3 aligned windows), VEXPL_LO/HI
#                $F500/$F580, VEXPL_CONT $F600, USEVEC $F680, FW state
#                $F780, RASTER_ENTRY/emit stubs $F7C0.  VDESC + the
#                driver SINCOS ride the bank A window hole ($A400+ =
#                flat $7C00/$7E00).  $F800+ = tube client OS.
# The bank images arrive VERBATIM from the banked builders; every
# bank-resident home is BANKx_ORG + offset (gen_abi/layout formulas).
MEMORY {
    DRV:    start = $0F00, size = $0440, file = "engine_drv.bin";
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    WORK:   start = $0E20, size = $00E0, type = rw, file = "";
    CODE:   start = $1340, size = $44C0, file = "engine_code.bin";
    # CBITS stops at $F200: the data run above is loader/python-seeded
    # and invisible to ld65 — clipper growth past it must be a link
    # error, never a silent stomp (the declared-size-is-a-lie lesson).
    CBITS:  start = $D800, size = $1A00, file = "engine_cbits.bin";
}
SEGMENTS {
    DRV:    load = DRV,  type = ro, optional = yes;   # phase 4: the banked driver
    ZEROPAGE: load = ZP, type = zp;
    WORK:   load = WORK,  type = bss;
    BANKC:  load = CBITS, type = ro;
    VPLOTC: load = CBITS, type = ro, optional = yes;   # empty: vplot is banked-only
    VPTAB:  load = CBITS, type = ro, optional = yes;   # object dispatch tables
    PMOVE:  load = CODE,  type = ro;
    PMH:    load = CODE,  type = ro;
    CODE:   load = CODE,  type = ro, align = $100;
    RWC:    load = CODE,  type = ro, optional = yes;
    RWCARD: load = CODE,  type = ro, optional = yes;
    SHTAB:  load = CODE,  type = ro, align = $100, optional = yes;
    PMB1:   load = CODE,  type = ro, optional = yes;
    PMB2:   load = CODE,  type = ro, optional = yes;
    PMB3:   load = CODE,  type = ro, optional = yes;
    PMB4:   load = CODE,  type = ro, optional = yes;
    PMEXT:  load = CODE,  type = ro, optional = yes;
    PMSF:   load = CODE,  type = ro, optional = yes;
    OBJX:   load = CODE,  type = ro, optional = yes;
    OBJB:   load = CODE,  type = ro, optional = yes;
    OBJG:   load = CODE,  type = ro, optional = yes;
    PQ:     load = CODE,  type = ro, optional = yes;
    PMMU:   load = CODE,  type = ro, optional = yes;
    PMWK:   load = CODE,  type = ro, optional = yes;
    PMCND:  load = CODE,  type = ro, optional = yes;
    PMZ:    load = CODE,  type = ro, optional = yes;
    PMCOL:  load = CODE,  type = ro, optional = yes;
    HUD:    load = CODE,  type = ro, optional = yes;   # host draws the HUD;
                                                       # flat ships none
}
