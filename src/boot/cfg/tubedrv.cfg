MEMORY {
    BOOTM: start = $7800, size = $0400, file = "%O.boot", fill = no;
    RESM:  start = $F600, size = $0010, file = "%O.res", fill = yes, fillval = $00;
    EMITM: start = $F610, size = $0200, file = "%O.emit", fill = no;
}
SEGMENTS {
    BOOT:     load = BOOTM, type = ro;
    RESIDENT: load = RESM,  type = ro;
    EMIT:     load = EMITM, type = ro;
}
