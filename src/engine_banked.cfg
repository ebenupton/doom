# Whole engine, banked (BBC hardware) build — code + the bank windows
# (2026-07-20 consolidation):
#   CODE  — ALL main-RAM engine code, $2A00-$57FF (FB at $5800). One
#           blob; content order = object order (slope_div=ang module,
#           span_clip, bsp_render) then include order.
#   BANKC — the clipper+rasteriser bank C window ($8000).
#   HUD   — debug HUD, bank C window @ $A400.
MEMORY {
    # The driver, now a ca65 link unit (2026-08-30).  $0F00 is a CONTRACT:
    # !BOOT calls it and both boot stubs JMP DRV_ORG.  It abuts PMOVE/CODE
    # at $1340, so this is the head of the one engine code area.
    DRV:    start = $0F00, size = $0440, file = "engine_drv.bin";
    # Zero page, LINKER-ALLOCATED (2026-08-30).  The reservations live in
    # zp.inc's ZEROPAGE segment; ld65 hands out the bytes, so a free byte
    # is one it has not assigned rather than one nobody named.
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    # THE data segment (2026-08-30): writable scratch, so storage stops
    # being baked as literal equates.  $0C20-$0CFF is free in BOTH builds
    # (mapshuf), above the old hand-laid arena and below COLPORT at the
    # LOW_BASE $0D00 load base.  Identical in both maps by the bottom-22K
    # rule, which is what lets one declaration serve both.
    WORK:   start = $0C20, size = $00E0, type = rw, file = "";
    BANKC:  start = $8000, size = $1800, file = "span_clip_bankc.bin";
    # 2026-08-25: the region grew $1700 -> $1800 when the fused
    # apply/merge/kill/flat cluster moved down from MAIN (funding the
    # exact banded backface). The tail re-cut the same day: VEXPL_CONT
    # $9800-$987F, FW_BASE $9880 (RUNTIME STATE, not linker-visible —
    # the region MUST stop at $97FF or code lands on the ex-records
    # pages silently). Next tenants: SINCOS $9900, USEVEC $9B00.
    VPLOTC: start = $B400, size = $0C00, file = "engine_vplot_bankc.bin";
    # ONE code region (2026-08-30): PMOVE $1340-$19FF abutted CODE
    # $1A00 exactly, so the split was a boundary with nothing on
    # either side of it.  Merged; the PMOVE/PMH/PMMU segments now
    # load here.  Head is still PMOVE_BASE ($1340) -- build_anim_ssd
    # asserts driver_end <= it.
    CODE:   start = $1340, size = $44C0, file = "bsp_render_bk.bin";
    # ($2500 -> $1A00 2026-08-26: the LOW-RAM CONSOLIDATION — driver $0F00,
    #  PMOVE $1340, CODE $1A00 form ONE contiguous engine area ending at
    #  the framebuffer; ~2.9K of slack now aggregates at the CODE tail.)
    # (head $2A00 -> $2600 2026-08-19: the -$400 window slide that took
    #  the pm_frame code out of bank B — PMB1-4 now load HERE, appended
    #  after CODE in this declaration order, identical in both builds.
    #  $2600 -> $2500 2026-08-23: PMOVE+PMH measure 1,728 B and ended at
    #  $24FF, so the last page of the PMOVE region was dead slack. CODE
    #  claims it: +256 B, which is what lets the barrel billboard art in.
    #  $2500-$25FF was the only free-in-BOTH-builds run adjacent to CODE
    #  — the flat exception-window tenants stop at PMH $2300-$23FF, and
    #  no symbol in either map lands in $2400-$25FF. Going further down
    #  needs the flat VCACHE/VXC rehome, not just a cfg edit.)
    HUD:    start = $A400, size = $0100, file = "bsp_render_hud_bk.bin";
    # size $0200 -> $0100 2026-08-24: VDESC is seeded at $A500 by
    # banked_bsp, so the region was a LIE and ld65 could not catch the
    # HUD growing into it. It did: the font search took the segment to
    # 295 B, past $A500, and pressing H crashed the Model B. The region
    # now stops where the next tenant starts, so an overflow is a build
    # error instead of a crash on hardware.
    # (bank B code regions PMB1-4 DELETED 2026-08-19: banks are data-only
    #  again — the pm_frame slices live in the CODE region tail)
}
SEGMENTS {
    DRV:    load = DRV,  type = ro;
    ZEROPAGE: load = ZP, type = zp;
    WORK:   load = WORK,  type = bss;
    BANKC:  load = BANKC, type = ro;
    VPLOTC: load = VPLOTC, type = ro, align = $100;
    CODE:   load = CODE,  type = ro, align = $100;
    PMB1:   load = CODE,  type = ro;
    PMB2:   load = CODE,  type = ro;
    PMB3:   load = CODE,  type = ro;
    PMB4:   load = CODE,  type = ro;
    PMEXT:  load = CODE,  type = ro;
    PMSF:   load = CODE,  type = ro, optional = yes;   # flat: the walled CLIPF tail $71A4
    OBJX:   load = CODE,  type = ro, optional = yes;   # flat: the $7200 gap
    OBJB:   load = CODE,  type = ro, optional = yes;   # flat: PMMU spare
    OBJG:   load = CODE,  type = ro, optional = yes;   # flat: PMWK spare
    PQ:     load = CODE,  type = ro, optional = yes;   # flat: VPLOTF tail
    PMMU:   load = CODE,  type = ro, optional = yes;   # flat: the $E8C8 gap
    PMWK:   load = CODE,  type = ro, optional = yes;   # flat: the $E9A8 tail
    # (PMEXT: flat loads it at $D900 — its own area; banked CODE has room)
    PMOVE:  load = CODE,  type = ro;
    PMH:    load = CODE,  type = ro;
    HUD:    load = HUD,   type = ro;
}
