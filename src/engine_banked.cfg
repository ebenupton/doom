# Whole engine, banked (BBC hardware) build — code + the bank windows
# (2026-07-20 consolidation):
#   CODE  — ALL main-RAM engine code, $2C00-$57FF (FB at $5800). One
#           blob; content order = object order (slope_div=ang module,
#           span_clip, bsp_render) then include order.
#   BANKC — the clipper+rasteriser bank C window ($8000).
#   HUD   — debug HUD, bank C window @ $A400.
MEMORY {
    BANKC:  start = $8000, size = $1700, file = "span_clip_bankc.bin";
    LDATA:  start = $1E00, size = $0100, file = "engine_ldata_bk.bin";
    VPLOTC: start = $B400, size = $0C00, file = "engine_vplot_bankc.bin";
    CODE:   start = $2C00, size = $2C00, file = "bsp_render_bk.bin";
    PMOVE:  start = $24D2, size = $072E, file = "engine_pmove_bk.bin";
    # (start $2548 -> $24E0 2026-08-15: the momentum driver rework shrank
    #  WALKDRV; build_anim_ssd asserts driver_end <= $24E0)
    HUD:    start = $A400, size = $0200, file = "bsp_render_hud_bk.bin";
    # pm_frame in BANK B free windows (Eben-blessed movement code,
    # 2026-08-15): the census map is in colmap.py/project_pmove. The
    # files are stitched into the lb image by banked_bsp (BEFORE
    # define_bank) at addr-$8000.
    PMB1:   start = $B500, size = $0200, file = "engine_pmb1_bk.bin";
    PMB2:   start = $B198, size = $0168, file = "engine_pmb2_bk.bin";
    PMB3:   start = $B348, size = $00B8, file = "engine_pmb3_bk.bin";
    PMB4:   start = $B862, size = $005E, file = "engine_pmb4_bk.bin";
}
SEGMENTS {
    BANKC:  load = BANKC, type = ro;
    LDATA:  load = LDATA, type = ro;
    VPLOTC: load = VPLOTC, type = ro, align = $100;
    CODE:   load = CODE,  type = ro, align = $100;
    PMOVE:  load = PMOVE, type = ro;
    HUD:    load = HUD,   type = ro;
    PMB1:   load = PMB1,  type = ro;
    PMB2:   load = PMB2,  type = ro;
    PMB3:   load = PMB3,  type = ro;
    PMB4:   load = PMB4,  type = ro;
    PMH:    load = PMOVE, type = ro;
}
